<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeArena | Patterns - Crack the Code</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #050505;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.2), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.2), transparent 40%);
            background-attachment: fixed;
            color: #f8fafc;
        }

        .glass-panel {
            background: rgba(20, 20, 40, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(138, 43, 226, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6), 0 0 20px rgba(138, 43, 226, 0.4);
        }

        /* Pattern Element Animations */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .pattern-item {
            animation: popIn 0.5s ease-out forwards;
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            width: 80px;
            height: 80px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.05);
        }

        /* Add a staggered delay variable to animation */
        .delay-0 { animation-delay: 0s; }
        .delay-1 { animation-delay: 0.15s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.45s; }
        .delay-4 { animation-delay: 0.6s; }
        .delay-5 { animation-delay: 0.75s; }

        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border: 2px solid rgba(138, 43, 226, 0.4);
        }

        .option-btn:hover {
            transform: translateY(-4px);
            border-color: rgba(56, 189, 248, 0.8);
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
        }

        .option-btn:active {
            transform: translateY(2px);
        }

        /* Missing Element Styles */
        .missing-item {
            border: 3px dashed rgba(56, 189, 248, 0.5);
            background: rgba(56, 189, 248, 0.1);
            color: rgba(56, 189, 248, 0.8);
            font-weight: 800;
        }

        /* Specific Shapes for Shape Level */
        .shape-square { width: 50%; height: 50%; background: currentColor; }
        .shape-circle { width: 50%; height: 50%; background: currentColor; border-radius: 50%; }
        .shape-triangle { 
            width: 0; height: 0; 
            border-left: 20px solid transparent; 
            border-right: 20px solid transparent; 
            border-bottom: 40px solid currentColor; 
        }

    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-8">

    <!-- Header Map Button -->
    <a href="/game/grades-dashboard" class="absolute top-6 left-6 z-50 flex items-center gap-2 text-slate-400 hover:text-white transition-colors bg-slate-900/80 py-2 px-4 rounded-full border border-slate-700/50 backdrop-blur-md">
        <span>←</span> Back to Map
    </a>

    <!-- Main Container -->
    <div class="max-w-5xl mx-auto w-full flex-grow flex flex-col items-center justify-start mt-12 md:mt-4">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-block px-4 py-1 rounded-full bg-indigo-500/20 border border-indigo-400/30 text-indigo-300 font-black tracking-widest uppercase text-sm mb-4" id="level-indicator">
                LEVEL 1: COLOR PATTERNS
            </div>
            <h1 class="text-5xl md:text-6xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-violet-500 neon-text leading-tight">
                CRACK THE CODE
            </h1>
            <p class="text-xl text-slate-300 font-medium" id="mode-instruction">
                Observe the pattern and predict the next element!
            </p>
        </div>

        <!-- Pattern Display Canvas -->
        <div class="glass-panel w-full p-8 md:p-12 rounded-3xl mb-8 flex flex-col items-center">
            
            <!-- Where the array is rendered -->
            <div id="pattern-container" class="flex flex-wrap gap-4 md:gap-8 justify-center items-center py-4 min-h-[120px]">
                <!-- Example Pattern injected via JS -->
            </div>

            <!-- Hint Area (Conditional Code if level 5) -->
            <div id="logic-hint" class="hidden mt-8 p-4 rounded-xl bg-slate-800/80 border border-slate-600 font-mono text-amber-400 text-lg w-full max-w-2xl text-center">
                /* Condition: IF position is even... */
            </div>
        </div>

        <!-- Feedback Area -->
        <div id="feedback-area" class="w-full max-w-2xl text-center p-4 rounded-2xl mb-8 text-xl font-bold transition-all duration-300 opacity-0 transform translate-y-4">
            <!-- Correct / Wrong message -->
        </div>

        <!-- Control Panel (Options) -->
        <div class="w-full max-w-4xl grid grid-cols-2 md:grid-cols-4 gap-4" id="options-container">
            <!-- Option buttons injected via JS -->
        </div>

        <!-- Action / Next Button -->
        <div class="mt-12 opacity-0 transition-opacity duration-300" id="action-btn-container">
            <button onclick="handleNextStep()" class="bg-gradient-to-r from-green-400 to-emerald-600 text-white font-black text-xl px-12 py-4 rounded-full shadow-[0_0_20px_rgba(52,211,153,0.5)] hover:scale-105 transition-transform" id="action-btn">
                NEXT PATTERN ➡
            </button>
        </div>

    </div>

    <!-- Script Injection -->
    <script src="{{ url_for('static', filename='js/patterns.js') }}"></script>
</body>
</html>
