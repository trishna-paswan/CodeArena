<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeArena | Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; margin: 0; overflow: hidden; background-color: #050505; }
    #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .glass-container {
      background: rgba(10, 10, 20, 0.4);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(138, 43, 226, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
    }
    .neon-text { text-shadow: 0 0 10px rgba(138, 43, 226, 0.8), 0 0 20px rgba(138, 43, 226, 0.4); }
    .ui-layer { position: relative; z-index: 10; pointer-events: none; opacity: 0; transition: opacity 1.5s ease-in-out; }
    .ui-visible { opacity: 1; }
    .interactive { pointer-events: auto; }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/robot-assistant.css') }}">
  <script src="{{ url_for('static', filename='js/robot-assistant.js') }}"></script>
</head>

<body class="text-white antialiased">
  <div id="canvas-container"></div>

  <div id="main-ui" class="min-h-screen flex flex-col items-center justify-center text-center p-4 ui-layer">
    
    <header class="w-full max-w-5xl absolute top-0 left-1/2 -translate-x-1/2 p-4 flex justify-between items-center glass-container rounded-b-2xl interactive">
      <div class="logo">
        <a href="/" class="text-3xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-[#9370DB] to-[#8A2BE2] transform transition-transform duration-300 hover:scale-105">
          CodeArena
        </a>
      </div>
    </header>

    <div class="glass-container p-8 md:p-12 rounded-2xl max-w-3xl w-full interactive border-t border-white/10">
      <h1 class="text-5xl md:text-7xl font-bold tracking-tighter mb-4 bg-clip-text text-transparent bg-gradient-to-r from-[#9370DB] to-[#8A2BE2] neon-text">
        CODEARENA
      </h1>
      <p class="text-gray-400 text-lg md:text-xl max-w-2xl mx-auto leading-relaxed mb-10">
        The digital coliseum where <span class="text-[#9370DB] font-mono">logic</span> meets <span class="text-[#8A2BE2] font-mono">combat</span>. 
        Are you ready to interface?
      </p>

      <button onclick="enterGame()"
        class="group relative px-10 py-4 rounded-full bg-transparent border-2 border-[#8A2BE2] overflow-hidden transition-all duration-300">
        <div class="absolute inset-0 bg-[#8A2BE2] translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
        <span class="relative z-10 text-xl font-bold group-hover:text-white uppercase tracking-widest">Initiate Combat</span>
      </button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    let scene, camera, renderer, robots = [], particles;
    let mouseX = 0, mouseY = 0;
    let introPhase = 0; let introProgress = 0;

    function createRobot(x, y, z, isHero = false) {
      const group = new THREE.Group();
      const metalMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.9, roughness: 0.1, emissive: 0x8A2BE2, emissiveIntensity: isHero ? 0.5 : 0.2 });
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 1.5, 6), metalMat);
      group.add(body);
      const head = new THREE.Mesh(new THREE.BoxGeometry(1, 0.7, 0.8), metalMat); head.position.y = 1.3;
      group.add(head);
      group.position.set(x, y, z);
      scene.add(group);
      return { group, head, initialY: y, initialScale: 1, offset: Math.random() * Math.PI * 2, speed: 0.5 + Math.random() };
    }

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2, 50);
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById('canvas-container').appendChild(renderer.domElement);
      scene.add(new THREE.AmbientLight(0x404040, 3));
      const pL = new THREE.PointLight(0x8A2BE2, 20, 100); pL.position.set(10, 10, 20); scene.add(pL);
      robots.push(createRobot(0, 0, 0, true));
      for (let i = 0; i < 15; i++) {
        const r = createRobot((Math.random()-0.5)*60, (Math.random()-0.5)*40, (Math.random()-0.5)*30-20);
        r.initialScale = 0.5 + Math.random(); r.group.scale.setScalar(r.initialScale);
        robots.push(r);
      }
      const geo = new THREE.BufferGeometry(); const pos = new Float32Array(2000 * 3);
      for(let i=0; i<6000; i++) pos[i] = (Math.random()-0.5)*100;
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      particles = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.05, color: 0x8A2BE2, transparent: true, opacity: 0.4 }));
      scene.add(particles);
      window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
      document.addEventListener('mousemove', (e) => { mouseX = (e.clientX/window.innerWidth)*2-1; mouseY = -(e.clientY/window.innerHeight)*2+1; });
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      const time = Date.now() * 0.001;
      if (introPhase === 0) {
        introProgress += 0.005; camera.position.z = 50 - introProgress * 48.2; camera.position.y = 2 - introProgress * 0.7;
        if (introProgress >= 1) { introPhase = 1; introProgress = 0; document.getElementById('main-ui').classList.add('ui-visible'); }
      } else if (introPhase === 1) {
        introProgress += 0.01; camera.position.z = 1.8 + introProgress * 18.2; camera.position.y = 1.3 - introProgress * 1.3;
        if (introProgress >= 1) introPhase = 2;
      } else {
        camera.position.x += (mouseX * 5 - camera.position.x) * 0.02;
        camera.position.y += (-mouseY * 5 - camera.position.y) * 0.02;
        camera.lookAt(0, 0, 0);
      }
      robots.forEach(r => {
        r.group.position.y = r.initialY + Math.sin(time * r.speed + r.offset) * 0.5;
        r.head.rotation.y = THREE.MathUtils.lerp(r.head.rotation.y, mouseX * 0.5, 0.05);
      });
      particles.rotation.y = time * 0.02;
      renderer.render(scene, camera);
    }
    init();

    function enterGame() { window.location.href = "/gate"; }
  </script>
</body>
</html>
