<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeArena | Access Gate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #050505; overflow: hidden; }
    #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .glass-container {
      background: rgba(10, 10, 20, 0.4);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(138, 43, 226, 0.2);
    }
    .option-card {
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .option-card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: #8A2BE2;
      box-shadow: 0 0 30px rgba(138, 43, 226, 0.3);
    }
    .ui-layer { position: relative; z-index: 10; pointer-events: none; }
    .interactive { pointer-events: auto; }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/robot-assistant.css') }}">
  <script src="{{ url_for('static', filename='js/robot-assistant.js') }}"></script>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">
  <div id="canvas-container"></div>

  <div class="ui-layer w-full max-w-4xl">
    <div class="text-center mb-12">
      <h1 class="text-5xl font-bold tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-[#9370DB] to-[#8A2BE2] mb-4">
        ACCESS GATE
      </h1>
      <p class="text-gray-400">Identify your status to proceed into the combat simulation.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 interactive">
      <!-- New Recruit -->
      <a href="/setup" class="option-card glass-container p-10 rounded-3xl text-center group">
        <div class="w-20 h-20 bg-purple-500/20 rounded-full flex items-center justify-center mx-auto mb-6 group-hover:bg-purple-500/40 transition-colors">
          <svg class="w-10 h-10 text-[#9370DB]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
          </svg>
        </div>
        <h2 class="text-2xl font-bold mb-4">NEW RECRUIT</h2>
        <p class="text-gray-400 text-sm leading-relaxed">
          First time in the arena? Initialize your unique Game ID and set your parameters.
        </p>
      </a>

      <!-- Returning Veteran -->
      <a href="/login" class="option-card glass-container p-10 rounded-3xl text-center group">
        <div class="w-20 h-20 bg-cyan-500/20 rounded-full flex items-center justify-center mx-auto mb-6 group-hover:bg-cyan-500/40 transition-colors">
          <svg class="w-10 h-10 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
          </svg>
        </div>
        <h2 class="text-2xl font-bold mb-4">RETURNING VETERAN</h2>
        <p class="text-gray-400 text-sm leading-relaxed">
          Already established? Verify your secure identifier to resume your progress.
        </p>
      </a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    let scene, camera, renderer, particles;
    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.z = 50;
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById('canvas-container').appendChild(renderer.domElement);
      
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(5000 * 3);
      for(let i=0; i<15000; i++) pos[i] = (Math.random()-0.5)*150;
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      particles = new THREE.Points(geo, new THREE.PointsMaterial({size: 0.1, color: 0x8A2BE2}));
      scene.add(particles);
      
      animate();
    }
    function animate() {
      requestAnimationFrame(animate);
      particles.rotation.y += 0.001;
      particles.rotation.x += 0.0005;
      renderer.render(scene, camera);
    }
    init();
  </script>
</body>
</html>
