<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeArena | Traffic Lab</title>
    <link rel="stylesheet" href="/static/css/traffic-light.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/robot-assistant.css') }}">
    <script src="{{ url_for('static', filename='js/robot-assistant.js') }}"></script>
    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body class="min-h-screen flex flex-col p-4 md:p-8 text-slate-100">

    <!-- Header Map Button -->
    <a href="/grades/class/7" target="_parent" class="absolute top-6 left-6 z-50 flex items-center gap-2 text-slate-400 hover:text-white transition-colors bg-slate-900/80 py-2 px-4 rounded-full border border-slate-700/50 backdrop-blur-md">
        <span>←</span> Back to Map
    </a>
    
    <div id="stars-display" class="absolute top-6 right-6 z-50 flex items-center gap-2 text-yellow-400 font-bold text-2xl bg-slate-900/80 py-2 px-4 rounded-full border border-slate-700/50 backdrop-blur-md">
        ⭐ <span id="star-count">0</span>
    </div>

    <!-- Main Container -->
    <div class="max-w-6xl mx-auto w-full flex-grow flex flex-col items-center justify-start mt-12 md:mt-4">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="inline-block px-4 py-1 rounded-full bg-violet-500/20 border border-violet-400/30 text-violet-300 font-black tracking-widest uppercase text-sm mb-4">
                TRAFFIC CONTROL LAB
            </div>
            <h1 class="text-5xl md:text-6xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-violet-500 neon-text leading-tight">
                CONDITIONALS
            </h1>
        </div>

        <div id="game-container" class="glass-panel w-full p-4 md:p-8 rounded-3xl mb-8 flex flex-col items-center justify-center min-h-[550px] relative overflow-hidden">
            <!-- Theory Overlay -->
            <div id="theory-overlay" class="panel absolute inset-0 z-50 flex items-center justify-center bg-slate-900/90 backdrop-blur-sm rounded-3xl">
                <div class="story-box glass-panel p-10 max-w-2xl text-center shadow-[0_0_50px_rgba(138,43,226,0.3)]">
                    <h1 id="theory-title" class="text-4xl text-sky-400 font-black mb-4">Level 1</h1>
                    <p id="theory-text" class="text-xl text-slate-200">An IF statement runs...</p>
                    <div class="loader-bar w-full h-2 bg-violet-500 rounded-full mt-6"></div>
                </div>
            </div>

            <!-- Main Game Interface -->
            <div id="main-ui" class="hidden flex-col md:flex-row h-full w-full gap-8" style="width: 100%;">
                
                <!-- Left: Condition Builder -->
                <div class="side-panel w-full md:w-[45%] flex flex-col gap-4">
                    <h2 class="text-2xl font-bold text-sky-300 tracking-wide uppercase">Logic Blueprint</h2>
                    <div id="hint-text" class="bg-indigo-900/50 border border-indigo-500/30 p-4 rounded-xl text-slate-300 text-sm italic">
                        Drag the right action into the empty slot!
                    </div>
                    
                    <div id="block-workspace" class="workspace flex-grow bg-slate-900/80 rounded-xl p-4 border border-violet-500/30 overflow-y-auto min-h-[200px]">
                        <!-- Dynamic Blocks injected here -->
                    </div>

                    <div id="toolbox" class="toolbox min-h-[100px] bg-slate-800/80 rounded-xl p-4 flex flex-wrap gap-2 border border-slate-600/50">
                        <!-- Draggable choices injected here -->
                    </div>
                    
                    <button id="btn-run" class="mt-4 bg-gradient-to-r from-violet-600 to-fuchsia-600 border border-fuchsia-400 text-white font-black text-xl px-6 py-4 rounded-xl shadow-[0_0_20px_rgba(138,43,226,0.5)] hover:scale-105 transition-transform">
                        EXECUTE PROTOCOL
                    </button>
                </div>

                <!-- Center: Intersection -->
                <div class="center-panel w-full md:w-[55%] h-full min-h-[450px] relative flex justify-center items-center bg-slate-800/50 rounded-2xl border border-slate-700/50 overflow-hidden box-border mx-auto">
                    <div class="intersection relative w-[400px] h-[400px] scale-[0.85] md:scale-100">
                        <!-- Road Layout -->
                        <div class="road vertical-road">
                            <div class="lane vertical-lane lane-left"></div>
                            <div class="lane vertical-lane lane-right"></div>
                        </div>
                        <div class="road horizontal-road">
                            <div class="lane horizontal-lane lane-top"></div>
                            <div class="lane horizontal-lane lane-bottom"></div>
                        </div>
                        
                        <!-- Traffic Lights -->
                        <div id="light-top" class="traffic-light light-top"><div class="bulb red"></div><div class="bulb green active"></div></div>
                        <div id="light-bottom" class="traffic-light light-bottom"><div class="bulb red"></div><div class="bulb green active"></div></div>
                        <div id="light-left" class="traffic-light light-left"><div class="bulb red"></div><div class="bulb green active"></div></div>
                        <div id="light-right" class="traffic-light light-right"><div class="bulb red"></div><div class="bulb green active"></div></div>
                        
                        <!-- Vehicles container -->
                        <div id="vehicles-container" class="absolute inset-0"></div>
                    </div>
                </div>
            </div>

            <!-- Feedback Overlay -->
            <div id="feedback-overlay" class="hidden absolute inset-0 z-50 flex flex-col items-center justify-center bg-slate-900/95 backdrop-blur-md rounded-3xl">
                <h1 id="feedback-title" class="text-6xl font-black mb-4 text-white neon-text"></h1>
                <p id="feedback-explanation" class="text-2xl text-slate-300 max-w-2xl text-center mb-8 bg-slate-800/50 p-6 rounded-2xl border border-slate-600/50"></p>
                <div id="star-rewards" class="text-6xl mb-8 tracking-[1rem]"></div>
                
                <button id="btn-next" class="hidden bg-gradient-to-r from-emerald-400 to-emerald-600 border border-emerald-400 text-white font-black text-2xl px-10 py-4 rounded-xl shadow-[0_0_30px_rgba(52,211,153,0.5)] hover:scale-105 transition-transform">
                    NEXT LEVEL ➡
                </button>
                <button id="btn-retry" class="hidden bg-gradient-to-r from-rose-500 to-red-600 border border-red-400 text-white font-black text-2xl px-10 py-4 rounded-xl shadow-[0_0_30px_rgba(244,63,94,0.5)] hover:scale-105 transition-transform">
                    REBOOT LOGIC ↺
                </button>
            </div>
        </div>

    </div>

    <script src="/static/js/traffic-light.js"></script>
</body>

</html>
