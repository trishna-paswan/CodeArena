<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeArena | Re-Entry</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      overflow: hidden;
      background-color: #050505;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .glass-container {
      background: rgba(10, 10, 20, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(138, 43, 226, 0.3);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
    }

    .neon-text {
      text-shadow: 0 0 10px rgba(138, 43, 226, 0.8), 0 0 20px rgba(138, 43, 226, 0.4);
    }

    .ui-layer {
      position: relative;
      z-index: 10;
      pointer-events: none;
    }

    .interactive {
      pointer-events: auto;
    }

    .neon-input {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(138, 43, 226, 0.2);
      transition: all 0.3s ease;
    }

    .neon-input:focus {
      border-color: #8A2BE2;
      box-shadow: 0 0 15px rgba(138, 43, 226, 0.3);
      background: rgba(138, 43, 226, 0.05);
      outline: none;
    }

    @keyframes pulse-border {
      0% { border-color: rgba(138, 43, 226, 0.3); }
      50% { border-color: rgba(138, 43, 226, 0.8); }
      100% { border-color: rgba(138, 43, 226, 0.3); }
    }

    .animate-pulse-border {
      animation: pulse-border 3s infinite;
    }
  </style>
</head>

<body class="text-white antialiased">

  <!-- Three.js Canvas for Digital Tunnel -->
  <div id="canvas-container"></div>

  <!-- Main Content Layer -->
  <div class="min-h-screen flex items-center justify-center p-4 ui-layer">
    
    <div class="glass-container p-8 md:p-12 rounded-3xl max-w-md w-full interactive border-t border-white/10 animate-pulse-border">
      <div class="text-center mb-10">
        <h1 class="text-4xl font-bold tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-[#9370DB] to-[#8A2BE2] neon-text mb-2">
          RE-ENTER ARENA
        </h1>
        <p class="text-gray-400 text-sm">Identity verification required to resume combat.</p>
      </div>

      {% if error %}
      <div class="mb-6 p-4 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-sm text-center animate-pulse">
        {{ error }}
      </div>
      {% endif %}

      <form action="/login" method="POST" class="space-y-8">
        <div class="space-y-2">
          <label for="game_id" class="text-xs font-bold uppercase tracking-widest text-[#9370DB] ml-1">Secure Game ID</label>
          <input type="text" id="game_id" name="game_id" required
            class="w-full neon-input rounded-xl px-5 py-4 text-white font-mono placeholder-gray-600"
            placeholder="e.g. cyber_ninja_2026">
        </div>

        <button type="submit"
          class="group relative w-full py-4 rounded-xl bg-transparent border-2 border-[#8A2BE2] overflow-hidden transition-all duration-300">
          <div class="absolute inset-0 bg-[#8A2BE2] translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
          <span class="relative z-10 text-lg font-bold group-hover:text-white uppercase tracking-widest">Initiate Re-Entry</span>
        </button>

        <div class="pt-4 text-center border-t border-white/5">
          <p class="text-gray-500 text-sm">
            Forgotten your identifier? 
            <a href="/setup" class="text-[#9370DB] hover:text-[#8A2BE2] font-semibold transition-colors">Generate New ID</a>
          </p>
        </div>
      </form>
    </div>
  </div>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <script>
    let scene, camera, renderer, rings = [], particles;
    let mouseX = 0, mouseY = 0;

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 30;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      // Digital Tunnel Rings
      for (let i = 0; i < 20; i++) {
        const geometry = new THREE.TorusGeometry(i * 2 + 5, 0.05, 16, 100);
        const material = new THREE.MeshBasicMaterial({ 
          color: 0x8A2BE2, 
          transparent: true, 
          opacity: 1 - (i / 20) 
        });
        const ring = new THREE.Mesh(geometry, material);
        ring.position.z = -i * 5;
        scene.add(ring);
        rings.push(ring);
      }

      // Floating Data Particles
      const partGeo = new THREE.BufferGeometry();
      const posArray = new Float32Array(1000 * 3);
      for(let i=0; i<3000; i++) posArray[i] = (Math.random() - 0.5) * 100;
      partGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      particles = new THREE.Points(partGeo, new THREE.PointsMaterial({ 
        size: 0.05, 
        color: 0x00ffff, 
        transparent: true, 
        opacity: 0.5 
      }));
      scene.add(particles);

      window.addEventListener('resize', onWindowResize, false);
      document.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
      });

      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const time = Date.now() * 0.001;

      // Animate rings (tunnel effect)
      rings.forEach((ring, i) => {
        ring.position.z += 0.1;
        if (ring.position.z > 10) {
          ring.position.z = -90;
        }
        ring.rotation.z = time * 0.1 * (i % 2 ? 1 : -1);
      });

      // Subtle camera movement
      camera.position.x += (mouseX * 2 - camera.position.x) * 0.05;
      camera.position.y += (-mouseY * 2 - camera.position.y) * 0.05;
      camera.lookAt(0, 0, -20);

      particles.rotation.y += 0.001;
      renderer.render(scene, camera);
    }

    init();
  </script>

</body>
</html>
