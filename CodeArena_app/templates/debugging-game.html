<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeArena | Debugging Lab</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/css/debugging-game.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/robot-assistant.css') }}">
    
    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="{{ url_for('static', filename='js/robot-assistant.js') }}"></script>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-8 text-slate-100">

    <!-- Header Map Button -->
    <a href="/grades/class/7" target="_parent" class="absolute top-6 left-6 z-50 flex items-center gap-2 text-slate-400 hover:text-white transition-colors bg-slate-900/80 py-2 px-4 rounded-full border border-slate-700/50 backdrop-blur-md">
        <span>←</span> Back to Map
    </a>
    
    <div id="stars-display" class="absolute top-6 right-6 z-50 flex items-center gap-2 text-yellow-400 font-bold text-2xl bg-slate-900/80 py-2 px-4 rounded-full border border-slate-700/50 backdrop-blur-md">
        ⭐ <span id="star-count">0</span>
    </div>

    <!-- Main Container -->
    <div class="max-w-6xl mx-auto w-full flex-grow flex flex-col items-center justify-start mt-12 md:mt-4">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="inline-block px-4 py-1 rounded-full bg-rose-500/20 border border-rose-400/30 text-rose-300 font-black tracking-widest uppercase text-sm mb-4">
                LOGIC DIAGNOSTICS LAB
            </div>
            <h1 class="text-5xl md:text-6xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-violet-500 neon-text leading-tight">
                DEBUGGING SQUAD
            </h1>
        </div>

        <div id="game-wrapper" class="glass-panel w-full p-6 md:p-10 rounded-3xl mb-8 flex flex-col min-h-[550px] relative overflow-hidden">
            
            <!-- Theory Overlay -->
            <div id="theory-overlay" class="absolute inset-0 z-50 flex items-center justify-center bg-slate-900/90 backdrop-blur-sm rounded-3xl transition-opacity duration-500">
                <div class="glass-panel p-10 max-w-2xl text-center shadow-[0_0_50px_rgba(138,43,226,0.3)]">
                    <h1 id="theory-title" class="text-4xl text-sky-400 font-black mb-4">Level 1</h1>
                    <p id="theory-text" class="text-xl text-slate-200">Prepare to debug.</p>
                    <div class="loader-bar w-full h-2 bg-violet-500 rounded-full mt-6"></div>
                </div>
            </div>

            <!-- Main UI -->
            <div id="main-ui" class="flex flex-col lg:flex-row gap-8 w-full h-full opacity-0 transition-opacity duration-500">
                
                <!-- Left: Code Editor -->
                <div class="w-full lg:w-1/2 flex flex-col h-full">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-2xl font-bold text-sky-300 tracking-wide uppercase">Source Code</h2>
                        <span id="instruction-mode" class="text-sm px-3 py-1 bg-sky-900/50 text-sky-200 rounded-full border border-sky-500/50">
                            Mode: Step Check
                        </span>
                    </div>
                    
                    <!-- Editor Body -->
                    <div id="code-block" class="code-editor flex-grow flex flex-col py-4 mode-step">
                        <!-- JS injects code lines here -->
                    </div>
                    
                    <div id="bug-instructions" class="mt-4 p-4 bg-rose-900/20 border border-rose-500/30 rounded-xl text-rose-200 text-center font-medium opacity-0 transition-opacity">
                        Bug detected! Click the line that contains the error.
                    </div>
                </div>

                <!-- Right: Diagnostics & Actions -->
                <div class="w-full lg:w-1/2 flex flex-col h-full">
                    <h2 class="text-2xl font-bold text-violet-300 tracking-wide uppercase mb-4">Runtime Memory</h2>
                    
                    <!-- 3D Variable Inspector -->
                    <div id="memory-stage" class="glass-panel flex-grow rounded-2xl flex items-center justify-center relative p-8 mb-4 border border-violet-500/30">
                        <div class="scene-3d w-full flex-wrap" id="variable-container-dock">
                            <!-- JS injects 3D variable boxes here -->
                        </div>
                    </div>
                    
                    <!-- Action Center -->
                    <div id="action-center" class="glass-panel p-6 rounded-2xl border border-sky-500/30 flex flex-col items-center justify-center min-h-[120px]">
                        
                        <!-- Step Button -->
                        <button id="btn-step" class="w-full bg-gradient-to-r from-sky-500 to-violet-600 font-bold text-xl py-4 rounded-xl shadow-[0_0_15px_rgba(56,189,248,0.4)] hover:scale-105 transition-transform text-white tracking-widest">
                            STEP FORWARD ➡
                        </button>
                        
                        <!-- Fix Options Form (hidden initially) -->
                        <div id="fix-options" class="hidden w-full flex flex-col gap-3">
                            <h3 class="text-slate-300 text-center mb-2 font-medium">Select the correct fix:</h3>
                            <div id="options-rack" class="flex flex-col gap-3">
                                <!-- Options injected here -->
                            </div>
                        </div>

                    </div>
                </div>

            </div>

            <!-- Feedback Overlay -->
            <div id="feedback-overlay" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-slate-900/95 backdrop-blur-md rounded-3xl opacity-0 pointer-events-none transition-opacity duration-300">
                <h1 id="feedback-title" class="text-6xl font-black mb-4 text-white neon-text"></h1>
                <p id="feedback-explanation" class="text-2xl text-slate-300 max-w-2xl text-center mb-8 bg-slate-800/50 p-6 rounded-2xl border border-slate-600/50 flex flex-col items-center text-[1.4rem]">
                    <!-- Specific feedback text -->
                </p>
                <div id="star-rewards" class="text-6xl mb-8 tracking-[1rem]"></div>
                
                <button id="btn-next" class="hidden bg-gradient-to-r from-emerald-400 to-emerald-600 border border-emerald-400 text-white font-black text-2xl px-10 py-4 rounded-xl shadow-[0_0_30px_rgba(52,211,153,0.5)] hover:scale-105 transition-transform tracking-wider">
                    NEXT MISSION ➡
                </button>
                <button id="btn-retry" class="hidden bg-gradient-to-r from-rose-500 to-red-600 border border-red-400 text-white font-black text-2xl px-10 py-4 rounded-xl shadow-[0_0_30px_rgba(244,63,94,0.5)] hover:scale-105 transition-transform tracking-wider">
                    DEBUG AGAIN ↺
                </button>
            </div>
        </div>

    </div>

    <!-- Script -->
    <script src="/static/js/debugging-game.js"></script>
</body>
</html>
