<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeArena | Initialize Identity</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; margin: 0; overflow: hidden; background-color: #050505; }
    #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .glass-container {
      background: rgba(10, 10, 20, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(138, 43, 226, 0.3);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
    }
    .neon-text { text-shadow: 0 0 10px rgba(138, 43, 226, 0.8), 0 0 20px rgba(138, 43, 226, 0.4); }
    .ui-layer { position: relative; z-index: 10; pointer-events: none; }
    .interactive { pointer-events: auto; }
    .neon-input {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(138, 43, 226, 0.2);
      transition: all 0.3s ease;
      color: white;
    }
    .neon-input:focus {
      border-color: #8A2BE2;
      box-shadow: 0 0 15px rgba(138, 43, 226, 0.3);
      background: rgba(138, 43, 226, 0.05);
      outline: none;
    }
    @keyframes pulse-border {
      0% { border-color: rgba(138, 43, 226, 0.3); }
      50% { border-color: rgba(138, 43, 226, 0.8); }
      100% { border-color: rgba(138, 43, 226, 0.3); }
    }
    .animate-pulse-border { animation: pulse-border 3s infinite; }
    select.neon-input option { background: #0a0a14; color: white; }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/robot-assistant.css') }}">
  <script src="{{ url_for('static', filename='js/robot-assistant.js') }}"></script>
</head>
<body class="text-white antialiased">
  <div id="canvas-container"></div>
  <div class="min-h-screen flex items-center justify-center p-4 ui-layer">
    <div class="glass-container p-8 md:p-12 rounded-3xl max-w-lg w-full interactive border-t border-white/10 animate-pulse-border">
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-[#9370DB] to-[#8A2BE2] neon-text mb-2">
          INITIALIZE IDENTITY
        </h1>
        <p class="text-gray-400 text-sm">Define your parameters to enter the arena.</p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-sm text-center animate-pulse">
        {{ error }}
        </div>
        {% endif %}

        <form action="/setup" method="POST" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label for="name" class="text-xs font-bold uppercase tracking-widest text-[#9370DB] ml-1">Codename</label>
            <input type="text" id="name" name="name" required class="w-full neon-input rounded-xl px-5 py-3 placeholder-gray-600" placeholder="e.g. Neo">
          </div>
          <div class="space-y-2">
            <label for="game_id" class="text-xs font-bold uppercase tracking-widest text-[#9370DB] ml-1">Unique Game ID</label>
            <input type="text" id="game_id" name="game_id" required class="w-full neon-input rounded-xl px-5 py-3 font-mono placeholder-gray-600" placeholder="ninja_01">
          </div>
        </div>
        <div class="space-y-2">
          <label for="difficulty" class="text-xs font-bold uppercase tracking-widest text-[#9370DB] ml-1">Experience Level</label>
          <select id="difficulty" name="difficulty" required class="w-full neon-input rounded-xl px-5 py-3 appearance-none cursor-pointer">
            <option value="" disabled selected>Select Skill Tier</option>
            <option value="Beginner">Beginner (New recruit)</option>
            <option value="Intermediate">Intermediate (Logic specialist)</option>
            <option value="Advanced">Advanced (Systems architect)</option>
          </select>
        </div>
        <button type="submit" class="group relative w-full py-4 rounded-xl bg-transparent border-2 border-[#8A2BE2] overflow-hidden transition-all duration-300">
          <div class="absolute inset-0 bg-[#8A2BE2] translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
          <span class="relative z-10 text-lg font-bold group-hover:text-white uppercase tracking-widest">Construct Profile</span>
        </button>
        <div class="pt-4 text-center border-t border-white/5">
          <p class="text-gray-500 text-sm">Already registered? <a href="/login" class="text-[#9370DB] hover:text-[#8A2BE2] font-semibold transition-colors">Verify Existing Identity</a></p>
        </div>
      </form>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    let scene, camera, renderer, grid;
    let mouseX = 0, mouseY = 0;
    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 10);
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById('canvas-container').appendChild(renderer.domElement);
      grid = new THREE.GridHelper(100, 50, 0x8A2BE2, 0x1a1a2e);
      scene.add(grid);
      window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
      document.addEventListener('mousemove', (e) => { mouseX = (e.clientX/window.innerWidth)*2-1; mouseY = -(e.clientY/window.innerHeight)*2+1; });
      animate();
    }
    function animate() {
      requestAnimationFrame(animate);
      grid.position.z = (Date.now() * 0.005) % 2;
      camera.position.x += (mouseX * 5 - camera.position.x) * 0.05;
      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
    }
    init();
  </script>
</body>
</html>
