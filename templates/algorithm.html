<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algorithm Puzzle - CodeArena</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <div class="logo">
      <a href="/"><h1>CodeArena</h1></a>
    </div>
  </header>

  <main class="game-page">
    <h1>️ Making Tea is an Algorithm </h1>
    <p>Drag and drop the steps into the correct order to make a perfect cup of tea!</p>

    <div class="game-container">
      <div class="steps-container">
        <h3>Available Steps</h3>
        <div class="step" draggable="true">Add sugar</div>
        <div class="step" draggable="true">Boil water</div>
        <div class="step" draggable="true">Pour into cup</div>
        <div class="step" draggable="true">Add tea leaves</div>
      </div>

      <div class="drop-area-container">
        <h3>Your Algorithm</h3>
        <div class="drop-area"></div>
      </div>
    </div>

    <button onclick="checkOrder()">Check My Algorithm </button>

    <div class="robot-feedback">
        <img src="https://api.iconify.design/emojione/robot-face.svg" alt="Robot Mascot" />
      <p id="robot-text">Arrange the steps correctly to impress me! </p>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 CodeArena. All rights reserved.</p>
  </footer>

  <script src="{{ url_for('static', filename='js/algorithm.js') }}"></script>
</body>
</html>
