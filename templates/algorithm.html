<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeArena | Algorithm Challenge</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Comic+Neue:wght@700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #FFD700;
      --secondary-color: #87CEEB;
      --grass-color: #7CFC00;
      --water-color: #00BFFF;
    }

    body {
      font-family: 'Comic Neue', cursive;
      background-color: var(--secondary-color);
    }

    h1, h2, h3 {
      font-family: 'Fredoka One', cursive;
    }

    /* Colorful Background */
    .sky-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60%;
      background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
      z-index: -2;
    }

    .ground-bg {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40%;
      background: var(--grass-color);
      border-top: 5px solid #558B2F;
      z-index: -2;
    }

    #tsparticles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    /* Glass Effect with more color */
    .glass-container {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border: 3px solid #558B2F;
      border-radius: 20px;
      color: #333;
    }

    /* Custom styles for draggable steps */
    .step[draggable="true"] {
      cursor: grab;
      border: 2px solid #8A2BE2;
      background: white;
      color: #333;
    }

    .step:hover {
        background: #f0f0f0;
    }

    .drop-area {
        background: rgba(255, 255, 255, 0.5);
    }

    .robot-feedback.success {
        border-color: #4CAF50;
        background-color: #E8F5E9;
    }

    .robot-feedback.error {
        border-color: #F44336;
        background-color: #FFEBEE;
    }
  </style>
</head>

<body class="text-gray-800 antialiased">

  <!-- Colorful Background -->
  <div class="sky-bg"></div>
  <div class="ground-bg"></div>
  <div id="tsparticles"></div>

  <!-- Main Content Wrapper -->
  <div class="min-h-screen flex flex-col items-center p-4">

    <!-- Header -->
    <header class="w-full max-w-5xl absolute top-0 left-1/2 -translate-x-1/2 p-4 flex justify-between items-center z-10 glass-container rounded-b-2xl mt-0">
      <div class="logo">
        <a href="/" class="text-3xl font-bold tracking-tight text-[#FF5722] transform transition-transform duration-300 hover:scale-105">
          CodeArena
        </a>
      </div>
    </header>

    <main class="game-page w-full lg:max-w-7xl xl:max-w-screen-xl mt-24 md:mt-28 mb-10 z-10">
      <h1 class="text-4xl md:text-6xl font-bold tracking-tight mb-4 text-[#FF5722] text-shadow text-center">
        The Algorithm of Tea
      </h1>
      <p class="text-gray-700 text-lg md:text-xl max-w-2xl mx-auto font-bold leading-relaxed text-center mb-8 bg-white/50 p-2 rounded-lg">
        Assemble the steps in the correct sequence.
      </p>

      <div class="game-container flex flex-col lg:flex-row justify-center items-start lg:items-stretch gap-8">
        
        <div class="steps-container glass-container p-6 shadow-lg w-full lg:w-1/2">
          <h3 class="text-2xl font-semibold mb-4 text-[#558B2F]">Available Steps</h3>
          <div class="available-steps space-y-4">
          </div>
        </div>

        <div class="drop-area-container glass-container p-6 shadow-lg w-full lg:w-1/2">
          <h3 class="text-2xl font-semibold mb-4 text-[#558B2F]">Your Algorithm</h3>
          <div class="drop-area min-h-[200px] border-4 border-dashed border-[#8A2BE2] rounded-lg p-4 space-y-4 flex flex-col justify-center items-center">
            <img id="drop-area-img" class="mx-auto my-4 w-16 h-16 opacity-50 transition-opacity duration-300" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 5v14M5 12h14'/%3E%3C/svg%3E" alt="Drop Area Empty">
          </div>
        </div>
      </div>

      <div class="flex justify-center gap-4 mt-10">
        <button onclick="checkOrder()"
          class="px-8 py-3 rounded-full bg-[#4CAF50] hover:bg-[#388E3C]
                 transition-all duration-300 text-lg font-bold text-white shadow-lg
                 transform hover:scale-110 focus:outline-none">
          Execute Algorithm!
        </button>
        <button onclick="resetTask()"
          class="px-8 py-3 rounded-full bg-[#FF9800] hover:bg-[#F57C00]
                 transition-all duration-300 text-lg font-bold text-white shadow-lg
                 transform hover:scale-110 focus:outline-none">
          Reset Task
        </button>
      </div>

      <div class="robot-feedback glass-container p-6 shadow-lg flex flex-col md:flex-row items-center justify-center gap-4 mt-10 max-w-2xl mx-auto border-[#FFD700]">
          <img src="https://api.iconify.design/mdi/robot-happy.svg?color=%23FFD700" alt="Robot Icon" class="w-12 h-12" />
        <p id="robot-text" class="text-gray-800 text-lg font-bold">Awaiting your solution...</p>
      </div>
    </main>


    <!-- Footer -->
    <footer class="w-full max-w-5xl p-4 text-center text-[#CCCCCC] text-sm z-10 mt-auto">
      <p>&copy; 2026 CodeArena. All rights reserved.</p>
    </footer>

  </div>

  <!-- tsParticles -->
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.9.3/tsparticles.bundle.min.js"></script>

  <script src="{{ url_for('static', filename='js/algorithm.js') }}"></script>
  <script>
    tsParticles.load("tsparticles", {
      fpsLimit: 120,
      interactivity: {
        events: {
          onHover: {
            enable: true,
            mode: "bubble",
          },
          resize: true,
        },
        modes: {
          bubble: {
            distance: 200,
            duration: 2,
            opacity: 0.8,
            size: 10,
          },
        },
      },
      particles: {
        color: { value: ["#ffffff", "#87CEEB", "#7CFC00"] },

        links: {
          color: "#ffffff",
          distance: 150,
          enable: true,
          opacity: 0.3,
          width: 1,
        },

        move: {
          enable: true,
          speed: 1,
          outModes: { default: "bounce" }
        },

        number: {
          density: { enable: true, area: 800 },
          value: 40,
        },

        opacity: { value: 0.5 },

        shape: { type: "circle" },

        size: { value: { min: 2, max: 6 } },
      },

      detectRetina: true,
    });
  </script>

</body>
</html>
