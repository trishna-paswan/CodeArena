<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeArena - Select a Game</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <div class="logo">
      <a href="/"><h1>CodeArena</h1></a>
    </div>
  </header>

  <main>
    <h1>Choose Your Game</h1>
    <div class="game-list">
      <div class="game-card" onclick="selectGame('algorithm')">
        <h2>Algorithm Puzzle</h2>
        <p>Learn the basics of algorithms by solving a fun tea-making puzzle!</p>
        <button>Play Now</button>
      </div>
      <!-- Add more game cards here in the future -->
      <div class="game-card disabled">
        <h2>More Games Coming Soon!</h2>
        <p>Stay tuned for more exciting coding games.</p>
      </div>
    </div>
  </main>
  
  <footer>
    <p>&copy; 2026 CodeArena. All rights reserved.</p>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
