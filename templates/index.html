<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeArena | Home</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }

    /* Particle Background */
    #tsparticles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-color: #1a0000;
      background-image: linear-gradient(to right, #3b0000, #6a040f, #1a0000);
    }

    /* Glass Effect */
    .glass-container {
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>

<body class="text-white antialiased">

  <!-- Particle Canvas -->
  <div id="tsparticles"></div>

  <!-- Main Content -->
  <div class="min-h-screen flex flex-col items-center justify-center text-center p-4">

    <!-- Header -->
    <header class="w-full max-w-5xl absolute top-0 left-1/2 -translate-x-1/2 p-4 flex justify-between items-center z-10 glass-container rounded-b-2xl">
      <div class="logo">
        <a href="/" class="text-3xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-red-500 to-orange-400 transform transition-transform duration-300 hover:scale-105">
          CodeArena
        </a>
      </div>
    </header>

    <div class="glass-container p-8 md:p-12 rounded-2xl shadow-2xl max-w-3xl w-full">

      <h1 class="text-5xl md:text-6xl font-bold tracking-tight mb-4 bg-clip-text text-transparent bg-gradient-to-r from-red-500 to-orange-400">
        CodeArena
      </h1>

      <p class="text-gray-300 text-lg md:text-xl max-w-2xl mx-auto leading-relaxed">
        Where code is the <strong class="text-white">ultimate weapon</strong>. 
        Step into the arena and sharpen your programming combat skills.
      </p>

      <button onclick="enterGame()"
        class="mt-10 px-8 py-3 rounded-lg bg-red-600 hover:bg-red-500
               transition-all duration-300 text-lg font-semibold shadow-lg hover:shadow-red-500/40
               transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-red-500/50">
        Enter Game World
      </button>

    </div>
  </div>

  <!-- tsParticles -->
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.9.3/tsparticles.bundle.min.js"></script>

  <script>
    tsParticles.load("tsparticles", {
      fpsLimit: 120,
      interactivity: {
        events: {
          onHover: {
            enable: true,
            mode: "repulse",
          },
          resize: true,
        },
        modes: {
          repulse: {
            distance: 80,
            duration: 0.4,
          },
        },
      },
      particles: {
        color: { value: "#ff4d4d" },

        links: {
          color: "#ff4d4d",
          distance: 150,
          enable: true,
          opacity: 0.2,
          width: 1,
        },

        move: {
          enable: true,
          speed: 1,
          outModes: { default: "bounce" }
        },

        number: {
          density: { enable: true, area: 800 },
          value: 80,
        },

        opacity: { value: 0.2 },

        shape: { type: "circle" },

        size: { value: { min: 1, max: 3 } },
      },

      detectRetina: true,
    });

    function enterGame() {
      window.location.href = "/games";
    }
  </script>

</body>
</html>
