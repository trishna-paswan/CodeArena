<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeArena | Home</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      overflow: hidden;
      background-color: #050505;
    }

    /* 3D Canvas Container */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Glass Effect */
    .glass-container {
      background: rgba(10, 10, 20, 0.4);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(138, 43, 226, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
    }

    .neon-text {
      text-shadow: 0 0 10px rgba(138, 43, 226, 0.8), 0 0 20px rgba(138, 43, 226, 0.4);
    }

    .ui-layer {
      position: relative;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .ui-visible {
      opacity: 1;
    }

    .interactive {
      pointer-events: auto;
    }
  </style>
</head>

<body class="text-white antialiased">

  <!-- Three.js Canvas -->
  <div id="canvas-container"></div>

  <!-- Main Content Layer -->
  <div id="main-ui" class="min-h-screen flex flex-col items-center justify-center text-center p-4 ui-layer">

    <!-- Header -->
    <header class="w-full max-w-5xl absolute top-0 left-1/2 -translate-x-1/2 p-4 flex justify-between items-center glass-container rounded-b-2xl interactive">
      <div class="logo">
        <a href="/" class="text-3xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-[#9370DB] to-[#8A2BE2] transform transition-transform duration-300 hover:scale-105">
          CodeArena
        </a>
      </div>
    </header>

    <div class="glass-container p-8 md:p-12 rounded-2xl max-w-2xl w-full interactive border-t border-white/10">
      <h1 class="text-5xl md:text-7xl font-bold tracking-tighter mb-4 bg-clip-text text-transparent bg-gradient-to-r from-[#9370DB] to-[#8A2BE2] neon-text">
        CODEARENA
      </h1>

      <p class="text-gray-400 text-lg md:text-xl max-w-2xl mx-auto leading-relaxed mb-8">
        The digital coliseum where <span class="text-[#9370DB] font-mono">logic</span> meets <span class="text-[#8A2BE2] font-mono">combat</span>. 
        Are you ready to interface?
      </p>

      <button onclick="enterGame()"
        class="group relative px-10 py-4 rounded-full bg-transparent border-2 border-[#8A2BE2] overflow-hidden transition-all duration-300">
        <div class="absolute inset-0 bg-[#8A2BE2] translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
        <span class="relative z-10 text-xl font-bold group-hover:text-white">INITIATE COMBAT</span>
      </button>
    </div>
  </div>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <script>
    let scene, camera, renderer, robots = [], particles;
    let mouseX = 0, mouseY = 0;
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let introPhase = 0; // 0: Zooming in, 1: Transitioning out/UI reveal, 2: Interactive
    let introProgress = 0;
    let heroRobot;

    function createRobot(x, y, z, isHero = false) {
      const robotGroup = new THREE.Group();

      // Materials
      const metalMat = new THREE.MeshStandardMaterial({ 
        color: 0x1a1a1a, 
        metalness: 0.9, 
        roughness: 0.1,
        emissive: 0x8A2BE2,
        emissiveIntensity: isHero ? 0.5 : 0.2
      });
      
      const glowMat = new THREE.MeshBasicMaterial({ 
        color: 0x00ffff,
        transparent: true,
        opacity: 0.8
      });

      // Body
      const bodyGeo = new THREE.CylinderGeometry(0.8, 1.2, 1.5, 6);
      const body = new THREE.Mesh(bodyGeo, metalMat);
      robotGroup.add(body);

      // Core
      const coreGeo = new THREE.SphereGeometry(0.4, 16, 16);
      const core = new THREE.Mesh(coreGeo, glowMat);
      core.position.y = 0.2;
      robotGroup.add(core);

      // Head
      const headGeo = new THREE.BoxGeometry(1, 0.7, 0.8);
      const head = new THREE.Mesh(headGeo, metalMat);
      head.position.y = 1.3;
      robotGroup.add(head);

      // Face/Visor
      const visorGeo = new THREE.PlaneGeometry(0.8, 0.3);
      const visorMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide });
      const visor = new THREE.Mesh(visorGeo, visorMat);
      visor.position.set(0, 1.3, 0.41);
      robotGroup.add(visor);

      // Floating Shoulders
      const shoulderGeo = new THREE.SphereGeometry(0.3, 8, 8);
      const leftShoulder = new THREE.Mesh(shoulderGeo, metalMat);
      leftShoulder.position.set(-1.4, 0.5, 0);
      const rightShoulder = new THREE.Mesh(shoulderGeo, metalMat);
      rightShoulder.position.set(1.4, 0.5, 0);
      robotGroup.add(leftShoulder, rightShoulder);

      // Floating Rings
      const ringGeo1 = new THREE.TorusGeometry(2.2, 0.03, 16, 100);
      const ring1 = new THREE.Mesh(ringGeo1, new THREE.MeshBasicMaterial({ color: 0x8A2BE2, transparent: true, opacity: 0.3 }));
      ring1.rotation.x = Math.PI / 2;
      robotGroup.add(ring1);

      robotGroup.position.set(x, y, z);
      scene.add(robotGroup);
      
      return {
        group: robotGroup,
        head: head,
        core: core,
        rings: [ring1],
        shoulders: [leftShoulder, rightShoulder],
        initialY: y,
        initialScale: 1,
        offset: Math.random() * Math.PI * 2,
        speed: 0.5 + Math.random(),
        isHovered: false
      };
    }

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      
      // Start camera far away for intro
      camera.position.set(0, 2, 50);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      // Lights
      const ambientLight = new THREE.AmbientLight(0x404040, 3);
      scene.add(ambientLight);

      const pointLight = new THREE.PointLight(0x8A2BE2, 20, 100);
      pointLight.position.set(10, 10, 20);
      scene.add(pointLight);

      // Hero Robot at Center
      heroRobot = createRobot(0, 0, 0, true);
      heroRobot.group.scale.set(1.5, 1.5, 1.5);
      robots.push(heroRobot);

      // Background Robots
      for (let i = 0; i < 15; i++) {
        const x = (Math.random() - 0.5) * 60;
        const y = (Math.random() - 0.5) * 40;
        const z = (Math.random() - 0.5) * 30 - 20;
        const r = createRobot(x, y, z);
        r.initialScale = 0.5 + Math.random();
        r.group.scale.set(r.initialScale, r.initialScale, r.initialScale);
        robots.push(r);
      }

      // Particles
      const partGeo = new THREE.BufferGeometry();
      const posArray = new Float32Array(2000 * 3);
      for(let i=0; i<6000; i++) posArray[i] = (Math.random() - 0.5) * 100;
      partGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      particles = new THREE.Points(partGeo, new THREE.PointsMaterial({ size: 0.05, color: 0x8A2BE2, transparent: true, opacity: 0.4 }));
      scene.add(particles);

      window.addEventListener('resize', onWindowResize, false);
      document.addEventListener('mousemove', onMouseMove, false);

      animate();
    }

    function onMouseMove(event) {
      mouseX = (event.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
      mouse.x = mouseX;
      mouse.y = mouseY;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const time = Date.now() * 0.001;

      if (introPhase === 0) {
        // Phase 0: Dramatic zoom into the eyes
        introProgress += 0.005;
        camera.position.z = THREE.MathUtils.lerp(50, 1.8, introProgress);
        camera.position.y = THREE.MathUtils.lerp(2, 1.3, introProgress);
        
        if (introProgress >= 1) {
          introPhase = 1;
          introProgress = 0;
          document.getElementById('main-ui').classList.add('ui-visible');
        }
      } else if (introPhase === 1) {
        // Phase 1: Pull back and reveal UI
        introProgress += 0.01;
        camera.position.z = THREE.MathUtils.lerp(1.8, 20, introProgress);
        camera.position.y = THREE.MathUtils.lerp(1.3, 0, introProgress);
        
        if (introProgress >= 1) {
          introPhase = 2;
        }
      } else {
        // Phase 2: Interactive Background
        camera.position.x += (mouseX * 5 - camera.position.x) * 0.02;
        camera.position.y += (-mouseY * 5 - camera.position.y) * 0.02;
        camera.lookAt(0, 0, 0);
      }

      // Animate Robots
      robots.forEach((r, index) => {
        // Floating & Pulsing
        r.group.position.y = r.initialY + Math.sin(time * r.speed + r.offset) * 0.5;
        r.core.scale.setScalar(0.8 + Math.sin(time * 3 + r.offset) * 0.2);
        
        // Rings & Shoulders
        if(r.rings[0]) r.rings[0].rotation.z += 0.01;
        r.shoulders.forEach(s => s.position.y = 0.5 + Math.sin(time * 2 + r.offset) * 0.05);

        // Interaction (only in Phase 2)
        if (introPhase === 2) {
          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObject(r.group, true);
          r.isHovered = intersects.length > 0;
          const targetScale = r.isHovered ? r.initialScale * 1.2 : r.initialScale;
          r.group.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);

          // Head tracking
          r.head.rotation.y = THREE.MathUtils.lerp(r.head.rotation.y, mouseX * 0.5, 0.05);
          r.head.rotation.x = THREE.MathUtils.lerp(r.head.rotation.x, -mouseY * 0.3, 0.05);
        }
      });

      particles.rotation.y = time * 0.02;
      renderer.render(scene, camera);
    }

    init();

    function enterGame() {
      window.location.href = "/games";
    }
  </script>

</body>
</html>
